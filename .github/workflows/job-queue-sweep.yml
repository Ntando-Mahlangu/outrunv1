name: Job Queue Sweep

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Belt-and-suspenders alongside curl's own --max-time below: stops a
    # hung run from silently occupying the schedule instead of failing
    # loudly within minutes (see webhook-sweep.yml's 2026-08-06 incident).
    timeout-minutes: 3
    steps:
      - name: Call job-queue sweep endpoint
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "APP_URL and CRON_SECRET repo secrets are not set — skipping. See DEPLOYMENT.md."
            exit 0
          fi
          # --retry absorbs a transient backend blip (a cold-start timeout,
          # a brief DB hiccup) instead of failing the whole scheduled run
          # over one slow response — curl already only retries on
          # actually-transient outcomes (429/5xx/timeouts), so a real,
          # persistent failure (e.g. a bad secret, a 401) still fails loudly.
          curl -sf --max-time 60 --retry 3 --retry-delay 5 -X GET "${{ secrets.APP_URL }}/api/cron/job-queue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
